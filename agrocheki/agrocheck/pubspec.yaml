name: agrocheck
description: "AGROCHECK - Diagnóstico de cultivos con IA offline para agricultores de Ecuador"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  fl_chart: ^0.68.0                # Gráficos de barras (tendencia semanal de precios)
  google_fonts: ^6.2.1             # Tipografía clara y legible

  # Cámara / Galería
  camera: ^0.10.5+9
  image_picker: ^1.1.2

  # IA offline - clasificación de imágenes
  tflite_flutter: ^0.12.1
  image: ^4.2.0                    # Preprocesamiento de imágenes para el modelo

  # Base de datos local
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # Red / Conectividad (precios de mercado)
  http: ^1.2.1
  connectivity_plus: ^6.0.3

  # Utilidades
  intl: ^0.19.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/model/modelo_agrocheck.tflite
    - assets/model/labels.txt
    - assets/images/logo.png

  # Para usar Google Fonts sin conexión, se recomienda además declarar
  # fuentes locales aquí si se desea garantizar 100% funcionamiento offline.
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf
  #       - asset: assets/fonts/Roboto-Bold.ttf
  #         weight: 700
